spring.application.name=aibasedhelpDeskSystem
server.port=8081
#-----SPRING_AI-CHAT_CONFIG-----
spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=llama3.2:latest
#spring.ai.ollama.chat.options.temperature=0.7
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#      SPRING_AI-CHAT_MEMORY
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# --- DATABASE ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_ai
spring.datasource.username=neal
spring.datasource.password=postgresneal
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
